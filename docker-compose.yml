services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${user}
      POSTGRES_PASSWORD: ${password}
      POSTGRES_DB: ${database}
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: ${user}
      DB_PASSWORD: ${password}
      DB_NAME: ${database}
volumes:
  db_data: